pre-commit:
  parallel: true
  commands:
    gofmt:
      run: |
        files=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.go$' || true)
        [ -z "$files" ] && exit 0
        fmt_out=$(gofmt -l $files)
        if [ -n "$fmt_out" ]; then
          echo "These files are not gofmt'ed:" >&2
          echo "$fmt_out" >&2
          echo "Run: gofmt -w $fmt_out" >&2
          exit 1
        fi
    govet:
      run: |
        go vet ./...
    golangci:
      # .golangci.yml เป็น config v2 ต้องใช้ golangci-lint v2 ขึ้นไป
      run: |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not found. Installing..." >&2
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
        fi
        golangci-lint run ./...

pre-push:
  commands:
    govulncheck:
      # ตรวจ vulnerability ของ dependency และ Go standard library ที่โค้ดเรียกใช้จริง
      # ใช้ฐานข้อมูลจาก https://vuln.go.dev จึงต้องต่อ internet ได้
      run: |
        go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
